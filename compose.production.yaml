name: afterstory-production

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: afterstory
      POSTGRES_DB: afterstory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a separate database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterstory -d afterstory"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [private]

  api:
    image: ${AFTERSTORY_API_IMAGE:?Set the tested backend image tag}
    command: ["uvicorn", "afterstory.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips=*"]
    environment:
      APP_ENV: production
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set the public site host}
      DATABASE_URL: ${DATABASE_URL:?Set the private PostgreSQL URL}
      LLM_ACTIVE_MODEL: ${LLM_ACTIVE_MODEL:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      USER_TIMEZONE: ${USER_TIMEZONE:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    networks: [private]

  web:
    image: ${AFTERSTORY_WEB_IMAGE:?Set the tested frontend image tag}
    ports:
      - "127.0.0.1:${AFTERSTORY_HTTP_PORT:-18080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [private]

networks:
  private:

volumes:
  postgres_data:
