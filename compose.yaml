name: afterstory
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: afterstory
      POSTGRES_PASSWORD: afterstory_local
      POSTGRES_DB: afterstory
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterstory -d afterstory"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
