map $http_x_forwarded_for $afterstory_client_ip {
    default $http_x_forwarded_for;
    "" $remote_addr;
}

map $http_x_forwarded_proto $afterstory_client_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $afterstory_client_ip;
        proxy_set_header X-Forwarded-Proto $afterstory_client_scheme;
        proxy_read_timeout 190s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
